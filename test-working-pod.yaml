apiVersion: v1
kind: Pod
metadata:
  name: test-working-injection
  namespace: test-policy
  labels:
    app: test-working
  annotations:
    sidecar.istio.io/inject: "true"
spec:
  containers:
  - name: app
    image: nginx:alpine
    ports:
    - containerPort: 80
  initContainers:
  - name: test-init
    image: busybox:1.28
    command: ['sh', '-c', 'echo "Test init container"; exit 0']