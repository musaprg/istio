apiVersion: v1
kind: Pod
metadata:
  name: test-sidecar-only
  namespace: test-policy
  labels:
    app: test-sidecar
  annotations:
    sidecar.istio.io/inject: "true"
spec:
  containers:
  - name: app
    image: nginx:alpine
    ports:
    - containerPort: 80
  - name: test-sidecar-readiness
    image: busybox:1.28
    command: ['sh', '-c', 'echo "Testing sidecar injection"; sleep 3600']